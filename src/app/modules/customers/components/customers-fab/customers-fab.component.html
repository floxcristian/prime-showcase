<!--
  ─── MOBILE FAB (Floating Action Button) — Material 3 Extended FAB ──
  Patrón canónico Material 3 (m3.material.io/components/extended-fab):
  acción primaria del screen vive como FAB anchored bottom-right.

  **Scroll-aware collapse** (M3 spec): Extended cuando user está near
  top o scrolleando arriba, collapse a mini (icon-only) cuando
  scrollea abajo. Reduce screen real estate ocupado durante reading
  flow sin esconder el CTA por completo. Implementado en
  customers-fab.component.ts → `fabExtended` signal + scroll listener.

  **Safe-area-inset-bottom**: respeta el iOS home indicator + Android
  gesture area. `calc(5rem + env(safe-area-inset-bottom))` ajusta
  posición dinámicamente según el device (5rem = 80px clearing de la
  mobile-footer nav; el env() agrega el inset si hay notch/indicator).

  No shadow per project CLAUDE.md — bg-primary saturado + rounded-2xl
  + position carry la elevation perceptualmente.

  Acción primaria → `<p-button>` (regla del proyecto: botones de acción
  siempre PrimeNG, no `<button>` a mano). El collapse mantiene la misma
  mecánica: `fabExtended()` alterna label visible ↔ icon-only; el
  `ariaLabel` cubre el estado colapsado. `z-10` = peldaño "sticky" de
  la escala del proyecto (único z raw permitido en templates).
-->
<p-button
  class="lg:hidden fixed right-4 z-10"
  [style.bottom]="'calc(5rem + env(safe-area-inset-bottom))'"
  [label]="fabExtended() ? 'Crear cliente' : undefined"
  icon="fa-sharp fa-regular fa-plus"
  ariaLabel="Crear nuevo cliente"
  styleClass="!rounded-2xl"
  (onClick)="createRequested.emit()"
/>
