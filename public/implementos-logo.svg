<!--
  Logotipo Implementos — versión principal (placa / parche).

  Tonos: PALETA DE COLOR PRIMARIA del brand book 2026 (cap. 03).
    azul  #006db6  PANTONE 300 U
    verde #00937f  PANTONE 334 U
    blanco #fff

  El archivo entregado por marca traía #0545ba / #059868. Se conservó su
  corrección estructural — la versión anterior de este asset dibujaba el
  wordmark DOS veces (una copia invisible bajo la placa opaca, ~48% de peso
  muerto servido en toda ruta autenticada) — y se devolvieron los tonos a
  los declarados, que son además los que el propio brand book pinta en el
  artwork del logo a lo largo de todo el capítulo 02.

  "NUNCA ALTERAR LOS TONOS EN EL LOGOTIPO" (cap. 02) se respeta: esto no
  aparta el logo de sus tonos corporativos, lo devuelve a ellos.

  Los tres colores están sincronizados con src/app/app.preset.ts. No editar
  a mano sin correr `npm run design-tokens:brand`.
  Ref: ADR-002.
-->
